name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# 同一分支的新推送取消上一次未完成的运行，省额度也省等待时间
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # 类型检查：原先没有这一步，vitest 未安装导致的 TS2307
      # 只有靠人手动跑 tsc 才能发现
      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # 构建是最强的一道门禁：它会真实编译所有路由。
      # 曾经的 next/font/google 外网依赖问题就是在这里暴露的，
      # 而不是在本地开发时。
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "file:./ci.db"
          JWT_SECRET: "ci-only-secret-at-least-32-characters-long"

      # 单元测试：只跑 vitest，不跑 Playwright（CI 里没有浏览器）
      - name: Unit tests
        run: npm run test:unit
        env:
          DATABASE_URL: "file:./ci.db"
          JWT_SECRET: "ci-only-secret-at-least-32-characters-long"
